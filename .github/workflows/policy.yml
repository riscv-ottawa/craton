# SPDX-License-Identifier: Apache-2.0

name: policy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sign-off on every commit
        env:
          DCO_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DCO_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A first push to a branch reports an all-zero base, and there is
          # nothing to subtract, so the whole history is checked instead.
          case "${DCO_BASE}" in
            ""|0000000000000000000000000000000000000000)
              range="${DCO_HEAD}"
              ;;
            *)
              range="${DCO_BASE}..${DCO_HEAD}"
              ;;
          esac
          ci/check-dco.sh "${range}"

  spdx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: License declared on every source file
        run: ci/check-spdx.sh
