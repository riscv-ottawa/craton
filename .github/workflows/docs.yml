# SPDX-License-Identifier: Apache-2.0

name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "v0.5.4"
  LYCHEE_VERSION: "0.24.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory /usr/local/bin
          mdbook --version

      - name: Build the book
        run: ci/check-book.sh

      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          version: ${{ env.LYCHEE_VERSION }}
          args: --config lychee.toml './*.md' 'docs/src/**/*.md'
          fail: true

      - name: Check reference-style link labels
        run: python3 ci/check-refdefs.py

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
        with:
          path: docs/book

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
